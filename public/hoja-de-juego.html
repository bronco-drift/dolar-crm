<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoja de juego · Juegos de papel</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #111;
        background: #fff;
        padding: 24px;
        max-width: 210mm;
        margin: 0 auto;
      }

      .volver {
        display: inline-block;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 500;
        color: #111;
        text-decoration: none;
        border: 1px solid #d7d7dc;
        border-radius: 10px;
        padding: 7px 12px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        font-weight: 600;
      }

      .jugador {
        font-size: 13px;
        color: #555;
      }

      .jugador i {
        display: inline-block;
        width: 150px;
        border-bottom: 1px solid #999;
      }

      .controles,
      .custom {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0 0;
      }

      .custom {
        margin: 10px 0 0;
        font-size: 13px;
        color: #555;
      }

      .controles button,
      .custom button {
        height: 36px;
        padding: 0 14px;
        border: 1px solid #d7d7dc;
        border-radius: 10px;
        background: #fff;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
      }

      .custom button {
        width: 36px;
        padding: 0;
        font-size: 16px;
      }

      .custom b {
        font-variant-numeric: tabular-nums;
        min-width: 20px;
        text-align: center;
      }

      .controles button.is-active,
      .controles .imprimir {
        background: #111;
        border-color: #111;
        color: #fff;
      }

      .controles .imprimir {
        margin-left: auto;
      }

      .grid {
        display: grid;
        margin-top: 16px;
      }

      /* Cuadrícula de verdad: bordes compartidos entre casillas */
      .celda {
        position: relative;
        border: 1px solid #c7c7cc;
        margin: 0 -1px -1px 0;
        aspect-ratio: 1 / 1.05;
      }

      .celda span {
        position: absolute;
        top: 3px;
        left: 5px;
        font-size: 9px;
        font-weight: 700;
        color: #c2c2c7;
        font-variant-numeric: tabular-nums;
      }

      .nota {
        margin-top: 12px;
        font-size: 11.5px;
        color: #888;
      }

      @media print {
        body {
          padding: 0;
        }

        .volver,
        .controles,
        .custom,
        .nota {
          display: none;
        }

        /* La cuadrícula completa entra en una carilla A4 */
        .celda {
          aspect-ratio: auto;
          height: calc(246mm / var(--filas, 12));
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <a class="volver" href="/herramientas">← Volver a los juegos</a>
    <header>
      <h1>Juegos de papel</h1>
      <div class="jugador">Jugador: <i></i></div>
    </header>

    <div class="controles">
      <button type="button" id="b812" onclick="preset(8, 12, this)">8 × 12</button>
      <button type="button" id="b612" onclick="preset(6, 12, this)">6 × 12</button>
      <button type="button" id="bcustom" onclick="personalizada(this)">Personalizada</button>
      <button type="button" class="imprimir" onclick="window.print()">Imprimir</button>
    </div>

    <div class="custom" id="custom" hidden>
      columnas
      <button type="button" onclick="ajustar('cols', -1)">−</button>
      <b id="vcols">6</b>
      <button type="button" onclick="ajustar('cols', 1)">+</button>
      · filas
      <button type="button" onclick="ajustar('filas', -1)">−</button>
      <b id="vfilas">6</b>
      <button type="button" onclick="ajustar('filas', 1)">+</button>
    </div>

    <div class="grid" id="grid"></div>

    <p class="nota">
      Una casilla por dibujo, en orden: la número 1 es el primer dibujo. La 8 × 12 rinde
      para toda la noche; en Personalizada elegís columnas y filas (desde 6 × 6).
    </p>

    <script>
      var cols = 8
      var filas = 12

      function armar() {
        var grid = document.getElementById('grid')
        grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)'
        grid.style.setProperty('--filas', filas)
        grid.innerHTML = ''
        for (var i = 1; i <= cols * filas; i++) {
          var c = document.createElement('div')
          c.className = 'celda'
          c.innerHTML = '<span>' + i + '</span>'
          grid.appendChild(c)
        }
      }

      function activo(boton) {
        var ids = ['b812', 'b612', 'bcustom']
        for (var i = 0; i < ids.length; i++) {
          document.getElementById(ids[i]).className = ''
        }
        boton.className = 'is-active'
      }

      function preset(c, f, boton) {
        cols = c
        filas = f
        document.getElementById('custom').hidden = true
        activo(boton)
        armar()
      }

      function personalizada(boton) {
        cols = 6
        filas = 6
        document.getElementById('vcols').textContent = cols
        document.getElementById('vfilas').textContent = filas
        document.getElementById('custom').hidden = false
        activo(boton)
        armar()
      }

      function ajustar(cual, dir) {
        if (cual === 'cols') {
          cols = Math.max(6, Math.min(12, cols + dir))
          document.getElementById('vcols').textContent = cols
        } else {
          filas = Math.max(6, Math.min(18, filas + dir))
          document.getElementById('vfilas').textContent = filas
        }
        armar()
      }

      preset(8, 12, document.getElementById('b812'))
    </script>
  </body>
</html>
